name: validate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Lint JSON manifests
        run: |
          jq . .claude-plugin/plugin.json > /dev/null
          jq . .claude-plugin/marketplace.json > /dev/null
          echo "JSON manifests are valid."

      - name: Check verdict/severity terms are consistent
        run: |
          # Files that render the verdict scale must use the same five verdicts.
          for term in catastrophe poor needs-work solid clean; do
            for f in skills/critical-reviewer/SKILL.md skills/critical-reviewer/references/quality-standards.md README.md; do
              grep -q "$term" "$f" || { echo "::error file=$f::missing verdict term '$term'"; exit 1; }
            done
          done
          # The agent defers to the skill for the output contract, so it must preload it.
          grep -qE '^\s*-\s*critical-reviewer\s*$' agents/code-reviewer.md \
            || { echo "::error file=agents/code-reviewer.md::agent must preload the critical-reviewer skill"; exit 1; }
          # [solid] is a verdict, never a per-issue severity tag.
          if grep -rn '\[solid\]' skills agents README.md; then
            echo "::error::[solid] is not a per-issue severity tag"; exit 1
          fi
          echo "Verdict terms and severity tags consistent."

      - name: Check eval suite structure
        run: |
          status=0
          for case in evals/*/; do
            [ -f "$case/prompt.md" ] || { echo "::error file=$case::missing prompt.md"; status=1; }
            ls "$case"graders/*.md > /dev/null 2>&1 || { echo "::error file=$case::no graders"; status=1; }
          done
          exit $status

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code

      - name: Validate plugin (strict)
        run: claude plugin validate ./ --strict --profile directory
